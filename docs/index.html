<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WASDE Complejo Soja</title>
<meta name="description" content="Hojas de balance USDA (WASDE + PSD) del complejo soja, maíz y trigo, con revisiones mensuales y fuente oficial en cada valor.">
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --up:#0ca30c; --down:#e66767; --accent:#3987e5; --accent-wash:rgba(57,135,229,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --up:#0ca30c; --down:#e66767; --accent:#3987e5; --accent-wash:rgba(57,135,229,.16);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
header{padding:18px 16px 0;max-width:1320px;margin:0 auto}
header h1{font-size:20px;margin:0 0 2px;font-weight:650}
.sub{color:var(--ink-2);font-size:13px}
.sub b{color:var(--ink)}
nav{max-width:1320px;margin:12px auto 0;padding:0 16px;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border)}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;color:var(--ink-2);font:inherit;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1320px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.bar label{color:var(--ink-2);font-size:12px;display:flex;gap:6px;align-items:center}
select,.seg button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--border);cursor:pointer;background:var(--surface)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-wash);color:var(--ink);font-weight:600}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;min-width:0}
.card h2{font-size:14px;margin:0 0 2px;font-weight:620}
.card h3{font-size:13px;margin:0 0 8px;font-weight:600}
.card .note{color:var(--muted);font-size:12px;margin:0 0 10px}
.kpi .lbl{color:var(--ink-2);font-size:12px}
.kpi .big{font-size:26px;font-weight:600;margin:4px 0 2px;cursor:pointer}
.kpi .row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);padding:3px 0;border-top:1px solid var(--border)}
.kpi .row span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
.focus{outline:2px solid var(--accent-wash)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:12.5px}
th,td{padding:5px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
th{color:var(--ink-2);font-weight:600;position:sticky;top:0;background:var(--surface)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
tr.sep td{border-top:2px solid var(--axis)}
td.cur,th.cur{background:var(--accent-wash)}
td.cmp,th.cmp{background:var(--surface-2)}
[data-s]{cursor:pointer}
[data-s]:hover{text-decoration:underline dotted;text-underline-offset:3px}
.up{color:var(--up)} .down{color:var(--down)}
.tag{display:inline-block;font-size:11px;color:var(--ink-2);border:1px solid var(--border);border-radius:4px;padding:0 5px;margin-left:4px}
.chart{position:relative;height:280px}
.chart.tall{height:360px}
#pop{position:fixed;z-index:50;max-width:420px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px 14px;font-size:12.5px;display:none}
#pop h4{margin:0 0 6px;font-size:13px}
#pop dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0 0 8px}
#pop dt{color:var(--muted)} #pop dd{margin:0}
#pop .links a{display:block;margin-top:3px}
#pop .x{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer}
.legend-help{color:var(--muted);font-size:12px;margin-top:8px}
.theme{position:absolute;right:16px;top:16px}
header{position:relative}
footer{max-width:1320px;margin:0 auto;padding:8px 16px 30px;color:var(--muted);font-size:12px}
.prose{max-width:820px}
.prose li{margin:4px 0}
@media (max-width:640px){ .g2{grid-template-columns:1fr} .kpi .big{font-size:22px} .theme{position:static;margin-top:8px} }
</style>
</head>
<body>
<header>
  <h1>Complejo Soja · Hojas de balance USDA</h1>
  <div class="sub" id="hdr"></div>
  <div class="theme"><select id="theme" aria-label="Tema"><option value="">Tema: sistema</option><option value="light">Claro</option><option value="dark">Oscuro</option></select></div>
</header>
<nav id="tabs" role="tablist"></nav>
<main id="view"></main>
<footer>Fuentes: USDA OCE/WAOB — WASDE (archivo oficial ESMIS, Cornell Mann Library) y USDA FAS — PSD Online. Hacé clic en cualquier valor para ver su fuente y abrir el documento original.</footer>
<div id="pop" role="dialog"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
  // evita que el navegador muestre datos viejos: la versión cambia cada 10 minutos
  (function () { var v = Math.floor(Date.now() / 6e5);
    document.write('<script src="data.js?v=' + v + '" charset="utf-8"><\/script><script src="app.js?v=' + v + '" charset="utf-8"><\/script>'); })();
</script>
</body>
</html>
